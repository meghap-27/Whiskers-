# Ginger-tabby palette: cream fur background, ginger coat accent, nose-leather brown text
[theme]
base = "light"
primaryColor = "#E07A2E"
backgroundColor = "#FBF1E3"
secondaryBackgroundColor = "#F3E0C4"
textColor = "#3A2417"
font = "monospace"

[server]
maxUploadSize = 20          # MB; keep in step with MAX_UPLOAD_MB

[browser]
gatherUsageStats = false
