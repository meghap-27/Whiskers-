name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Public-mode smoke test
        env:
          PUBLIC_MODE: "true"
          GROQ_API_KEY: "gsk_ci_placeholder"
        run: python -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('ui/streamlit_app.py', default_timeout=90).run(); assert not at.exception, at.exception"
